name: itransition-task6
services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nominal
      POSTGRES_USER: nominal_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports: ["127.0.0.1:5436:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nominal_admin -d nominal"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      options: {max-size: "10m", max-file: "2"}
  web:
    build: .
    image: itransition-task6:prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nominal_app:${APP_PASSWORD:?Set APP_PASSWORD}@database:5432/nominal
    ports: ["127.0.0.1:5007:8080"]
    depends_on:
      database: {condition: service_healthy}
    volumes:
      - ./artifacts:/app/artifacts:ro
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
    logging:
      options: {max-size: "10m", max-file: "2"}
volumes:
  postgres_data:
